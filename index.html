<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflekt</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

body{

background:#0F1115;
color:white;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.card{

width:100%;
max-width:420px;

background:#191C22;

padding:25px;

border-radius:24px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

}

h1{

font-size:34px;

margin-bottom:8px;

}

.subtitle{

opacity:.7;

margin-bottom:30px;

}

button{

width:100%;

border:none;

padding:18px;

border-radius:18px;

font-size:18px;

font-weight:700;

background:white;

color:black;

cursor:pointer;

}

.goal{

background:#11141A;

border-radius:14px;

padding:15px;

margin-bottom:12px;

border:1px solid #30343C;

}

input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:17px;

}

.streak{

font-size:52px;

font-weight:700;

margin-bottom:8px;

}

.small{

opacity:.6;

margin-bottom:25px;

}

</style>

</head>

<body>

<div class="card">

<div class="streak">
🔥 0
</div>

<div class="small">
Aktuelle Streak
</div>

<h1>
Reflekt
</h1>

<div class="subtitle">
Minimalistische Selbstreflexion.
Jeden Abend.
</div>

<div class="goal">
<input placeholder="🎯 Fokus Ziel 1">
</div>

<div class="goal">
<input placeholder="🎯 Fokus Ziel 2">
</div>

<div class="goal">
<input placeholder="🎯 Fokus Ziel 3">
</div>

<br>

<<button id="startButton">

🌙 Abendroutine beginnen

</button>

</div>

<script>

document
.getElementById("startButton")
.onclick=function(){

alert("😊 Frage 1\n\nHatte ich heute einen schönen Moment?");

};

</script>

</html>
